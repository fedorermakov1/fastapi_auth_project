apiVersion: batch/v1
kind: Job
metadata:
  name: fastapi-migration

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: fastapi-auth:latest
          imagePullPolicy: IfNotPresent

          command:
            - alembic
            - upgrade
            - head

          envFrom:
            - configMapRef:
                name: fastapi-config
            - secretRef:
                name: fastapi-secret
services:

  postgres:
    image: postgres:18
    container_name: postgres-container

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7
    container_name: redis-container

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-container

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  celery-calculations-worker:
    build: .
    container_name: celery-calculations-worker-container
    command: celery -A app.celery_app worker --loglevel=INFO --without-mingle --concurrency=2 -Q calculations
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy

  celery-emails-worker:
    build: .
    container_name: celery-emails-worker-container
    command: celery -A app.celery_app worker --loglevel=INFO --without-mingle --concurrency=2 -Q emails
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy

  celery-orders-worker:
    build: .
    container_name: celery-orders-worker-container
    command: celery -A app.celery_app worker --loglevel=INFO --without-mingle --concurrency=2 -Q orders
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started


  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-container

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: docker.redpanda.com/redpandadata/console:v3.11.0
    container_name: kafka-ui-container
    environment:
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8081:8080"
    depends_on:
      - kafka



  kafka-rebalance-lab:
    build:
      context: .
      dockerfile: Dockerfile

    command: python -u -m app.services.kafka_lab_consumer

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: kafka-rebalance-lab
      KAFKA_TOPIC: kafka-rebalance-lab

      KAFKA_AUTO_OFFSET_RESET: earliest
      KAFKA_ENABLE_AUTO_COMMIT: "false"
      KAFKA_ENABLE_AUTO_OFFSET_STORE: "false"

      KAFKA_HEARTBEAT_INTERVAL_MS: "3000"
      KAFKA_SESSION_TIMEOUT_MS: "10000"
      KAFKA_MAX_POLL_INTERVAL_MS: "60000"

    depends_on:
      - kafka

  kafka-dlt-lab:
    build: .
    container_name: kafka-dlt-lab-container
    command: python -u -m app.services.kafka_dlt_consumer
    env_file:
      - .env
    depends_on:
      - kafka

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    container_name: schema-registry-container
    ports:
      - "8082:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - kafka

  kafka-schema-lab:
    build: .
    container_name: kafka-schema-lab-container
    command: python -u -m app.services.kafka_schema_lab
    env_file:
      - .env
    depends_on:
      - kafka
      - schema-registry

  kafka-consumer:
    build: .
    container_name: kafka-consumer-container
    command: python -u -m app.services.kafka_consumer
    env_file:
      - .env
    depends_on:
      - kafka

  kafka-retry-consumer:
    build: .
    container_name: kafka-retry-consumer-container
    command: python -u -m app.services.kafka_retry_consumer
    env_file:
      - .env
    depends_on:
      - kafka
      - postgres

  fastapi:
    build: .
    container_name: fastapi-auth-container

    ports:
      - "8000:80"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      MAX_RETRIES: ${MAX_RETRIES}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID}

    depends_on:
      postgres:
        condition: service_started

      redis:
        condition: service_started

      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
    external: true

  kafka_data:
    external: true
    name: bff5748a403be5d9d7d0c0a206a6889808fa240ffc7724594c5f692db2337059